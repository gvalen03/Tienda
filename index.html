<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda</title>

    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>

    <!-- =========================
         NAVEGACIÓN
    ========================== -->
    <header class="header">
        <nav class="navbar contenedor">

            <!-- Menú hamburguesa -->
            <button class="navbar__toggle" id="navbar-toggle" type="button" aria-label="Abrir menú"
                aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Logo -->
            <a href="./index.html" class="navbar__logo">
                <img src="./assets/images/logo.jpeg" alt="Logo de la papelería">
            </a>

            <div class="navbar__titulo">
                <h1>
                    Papelería
                </h1>
            </div>

            <!-- Enlaces -->
            <div class="navbar__links" id="navbar-links">
                <a href="#inicio">Inicio</a>
                <a href="#productos">Productos</a>
                <a href="#carrito">Carrito</a>
                <a href="#contacto">Contacto</a>
            </div>

        </nav>
    </header>


    <!-- =========================
         CONTENIDO PRINCIPAL
    ========================== -->
    <main>

        <section class="seccion-buscador">

            <label for="buscador">
                Buscar producto
            </label>

            <input type="text" id="buscador" placeholder="Escribe el nombre de un producto...">

        </section>

        <section id="inicio" class="encabezado-tienda">
            <h1>Bienvenido a Papelería Vibras</h1>
            <p>Encuentra tus productos favoritos.</p>
        </section>

        <section id="productos" class="catalogo">
            <h2>Productos</h2>

            <div id="contenedor-productos"></div>
        </section>

        <aside id="carrito" class="carrito">

            <h2>Carrito</h2>

            <div id="contenedor-carrito">
                <p>Tu carrito está vacío.</p>
            </div>

            <div class="resumen-carrito">

                <p>
                    Total:
                    <strong id="total-carrito">
                        $0
                    </strong>
                </p>

                <button type="button" id="btn-vaciar-carrito">
                    Vaciar carrito
                </button>

            </div>

        </aside>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer>

        <p>
            Miniproyecto Tienda
        </p>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="./js/productos.js"></script>
    <script src="./js/carrito.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/navbar.js"></script>

</body>

</html>
